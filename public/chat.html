<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knsight Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
header h1 { font-size: 16px; color: #a0a0d0; font-weight: 500; }
header .status { font-size: 12px; color: #6a6; }
header .run-id { font-size: 11px; color: #888; margin-left: auto; font-family: monospace; }
header .auto-approve { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #999; margin-left: 12px; }
header .auto-approve label { cursor: pointer; user-select: none; }
header .toggle { position: relative; width: 32px; height: 18px; appearance: none; background: #3a3a5a; border-radius: 9px; cursor: pointer; outline: none; transition: background 0.2s; }
header .toggle:checked { background: #3a8a4a; }
header .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #ccc; border-radius: 50%; transition: transform 0.2s; }
header .toggle:checked::after { transform: translateX(14px); background: #fff; }

#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

.msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.7; word-break: break-word; }
.msg.user { align-self: flex-end; max-width: 70%; background: #2a4a7a; color: #e8e8ff; border-bottom-right-radius: 2px; white-space: pre-wrap; }
.msg.assistant { align-self: flex-start; max-width: 85%; background: #2a2a4a; color: #d0d0e8; border-bottom-left-radius: 2px; }
.msg.error { align-self: center; background: #4a2020; color: #f88; font-size: 12px; }
.msg.system { align-self: center; background: transparent; color: #666; font-size: 11px; }

/* Markdown rendering in assistant messages */
.msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { color: #b0b0ff; margin: 12px 0 6px 0; }
.msg.assistant h1 { font-size: 18px; }
.msg.assistant h2 { font-size: 16px; }
.msg.assistant h3 { font-size: 14px; }
.msg.assistant p { margin: 6px 0; }
.msg.assistant strong { color: #e0e0ff; }
.msg.assistant code { background: #1a1a30; padding: 1px 5px; border-radius: 3px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; }
.msg.assistant pre { background: #12122a; padding: 10px 12px; border-radius: 4px; margin: 8px 0; overflow-x: auto; }
.msg.assistant pre code { background: none; padding: 0; }
.msg.assistant ul, .msg.assistant ol { margin: 6px 0 6px 20px; }
.msg.assistant li { margin: 3px 0; }
.msg.assistant table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
.msg.assistant th, .msg.assistant td { border: 1px solid #3a3a5a; padding: 6px 10px; text-align: left; }
.msg.assistant th { background: #1a1a3a; color: #b0b0d0; font-weight: 600; }
.msg.assistant td { background: #22223a; }
.msg.assistant blockquote { border-left: 3px solid #5a5a8a; padding-left: 12px; margin: 8px 0; color: #9a9ab0; }
.msg.assistant hr { border: none; border-top: 1px solid #3a3a5a; margin: 10px 0; }

/* Event stream */
.event-stream { align-self: stretch; background: #12122a; border: 1px solid #2a2a4a; border-radius: 6px; padding: 0; margin: 4px 0; font-size: 12px; }
.ev-header { padding: 6px 12px; color: #666; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; position: sticky; top: 0; background: #12122a; z-index: 1; }
.ev-header .count { color: #88a; }
.ev { padding: 4px 12px; line-height: 1.6; font-family: "SF Mono", Menlo, monospace; font-size: 11px; border-left: 3px solid transparent; overflow: hidden; text-overflow: ellipsis; }
.ev:hover { background: #1a1a3a; }
.ev .idx { color: #555; min-width: 20px; display: inline-block; }
.ev .agent { color: #7a7aff; }
.ev .tool-call { color: #7aaa7a; }
.ev .tool-result { color: #aa9a5a; }
.ev .output { color: #a0a0d0; }
.ev .arrow { color: #555; }
.ev .err { color: #f66; }
.ev.active { border-left-color: #5a5aff; background: #1a1a3a; }
.ev .args { color: #6a6a8a; }
.ev .summary { cursor: pointer; }
.ev .detail { display: none; margin-top: 4px; padding: 6px 8px; background: #0e0e20; border-radius: 3px; white-space: pre-wrap; word-break: break-all; color: #8a8aa0; font-size: 11px; max-height: 300px; overflow-y: auto; }
.ev .detail.open { display: block; }
.loading-dot { display: inline-block; width: 6px; height: 6px; background: #5a5aff; border-radius: 50%; margin-left: 6px; animation: pulse 1s ease-in-out infinite; vertical-align: middle; }
@keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

/* Approval card */
.approval-card { background: #2a2a1a; border: 1px solid #6a6a2a; border-radius: 8px; padding: 14px 18px; margin: 8px 0; align-self: stretch; }
.approval-card .info { font-size: 13px; color: #d0d0a0; white-space: pre-wrap; word-break: break-all; margin-bottom: 12px; max-height: 200px; overflow-y: auto; background: #1a1a10; padding: 8px 10px; border-radius: 4px; font-family: "SF Mono", Menlo, monospace; }
.approval-card .label { font-size: 12px; color: #aa9a3a; margin-bottom: 6px; font-weight: 600; }
.approval-card .actions { display: flex; gap: 10px; }
.approval-card .actions button { padding: 6px 20px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 500; }
.approval-card .btn-approve { background: #2a6a3a; color: #cfc; }
.approval-card .btn-approve:hover { background: #3a8a4a; }
.approval-card .btn-reject { background: #6a2a2a; color: #fcc; }
.approval-card .btn-reject:hover { background: #8a3a3a; }
.approval-card .btn-approve:disabled, .approval-card .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

#input-area { padding: 12px 20px; background: #16213e; border-top: 1px solid #2a2a4a; display: flex; gap: 10px; flex-shrink: 0; }
#input-area textarea { flex: 1; background: #1a1a30; color: #e0e0e0; border: 1px solid #3a3a5a; border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 44px; max-height: 120px; }
#input-area textarea:focus { border-color: #5a5aaa; }
#input-area button { background: #3a5a9a; color: #fff; border: none; border-radius: 6px; padding: 0 24px; font-size: 14px; cursor: pointer; white-space: nowrap; }
#input-area button:hover { background: #4a6aaa; }
#input-area button:disabled { background: #2a2a4a; color: #666; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Knsight</h1>
  <span class="status" id="status"></span>
  <span class="run-id" id="runId"></span>
  <span class="auto-approve">
    <input type="checkbox" class="toggle" id="autoApprove">
    <label for="autoApprove">Auto Approve</label>
  </span>
</header>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="输入消息..." autofocus></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<script>
const API = location.origin;
let runId = '';
let sending = false;

const $msg = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $status = document.getElementById('status');
const $runId = document.getElementById('runId');
const $autoApprove = document.getElementById('autoApprove');

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
});

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Simple markdown to HTML renderer
function renderMarkdown(text) {
  if (!text) return '';
  let html = esc(text);

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold and italic
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Tables
  html = html.replace(/((?:\|.+\|\n)+)/g, (block) => {
    const rows = block.trim().split('\n');
    if (rows.length < 2) return block;
    let table = '<table>';
    rows.forEach((row, i) => {
      // Skip separator row (|---|---|)
      if (/^\|[\s\-:]+\|$/.test(row.trim())) return;
      const cells = row.split('|').filter((c, j, a) => j > 0 && j < a.length - 1);
      const tag = i === 0 ? 'th' : 'td';
      table += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    table += '</table>';
    return table;
  });

  // Unordered lists
  html = html.replace(/((?:^- .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^- /, '') + '</li>').join('');
    return '<ul>' + items + '</ul>';
  });

  // Ordered lists
  html = html.replace(/((?:^\d+\. .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('');
    return '<ol>' + items + '</ol>';
  });

  // Paragraphs: convert double newlines
  html = html.replace(/\n\n+/g, '</p><p>');
  // Single newlines within paragraphs
  html = html.replace(/\n/g, '<br>');

  // Wrap in paragraph if not starting with block element
  if (!html.match(/^<(h[1-6]|pre|table|ul|ol|blockquote|hr)/)) {
    html = '<p>' + html + '</p>';
  }

  // Clean up empty paragraphs
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<(?:h[1-6]|pre|table|ul|ol|blockquote|hr))/g, '$1');
  html = html.replace(/(<\/(?:h[1-6]|pre|table|ul|ol|blockquote|hr)>)<\/p>/g, '$1');

  return html;
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'assistant') {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }
  $msg.appendChild(div);
  $msg.scrollTop = $msg.scrollHeight;
  return div;
}

function createEventStream() {
  const container = document.createElement('div');
  container.className = 'event-stream';
  const header = document.createElement('div');
  header.className = 'ev-header';
  header.innerHTML = '<span>Events <span class="loading-dot"></span></span><span class="count" data-count>0 events</span>';
  container.appendChild(header);
  $msg.appendChild(container);
  $msg.scrollTop = $msg.scrollHeight;
  return container;
}

function formatEventLine(ev, idx) {
  const agent = ev.agent_name || '?';
  const msg = ev.output?.message || {};
  const tc = msg.tool_calls || [];
  const tn = msg.tool_name || '';
  const content = msg.content || '';
  const role = msg.role || '';
  const uid = 'ev-' + Date.now() + '-' + idx;

  let summary = '';
  let detail = '';

  if (tc.length) {
    // Show content (thinking) if present alongside tool_calls
    const thinkPrefix = (content && role === 'assistant') ? esc(content.length > 60 ? content.slice(0,60)+'...' : content) + ' ' : '';
    const parts = tc.map(c => {
      const fn = c.function?.name || '';
      const args = c.function?.arguments || '';
      const short = args.length > 60 ? args.slice(0, 60) + '...' : args;
      return `<span class="arrow">-&gt;</span> <span class="tool-call">${esc(fn)}</span> <span class="args">${esc(short)}</span>`;
    });
    summary = thinkPrefix + parts.join(' ');
    let detailParts = [];
    if (content && role === 'assistant') detailParts.push('=== Output ===\n' + content);
    detailParts.push(...tc.map(c => `=== ${c.function?.name || ''} ===\n${c.function?.arguments || ''}`));
    detail = detailParts.join('\n\n');
  } else if (tn) {
    const short = content.length > 80 ? content.slice(0, 80) + '...' : content;
    summary = `<span class="arrow">&lt;-</span> <span class="tool-result">${esc(tn)}</span> <span class="args">[${content.length}c] ${esc(short)}</span>`;
    detail = content;
  } else if (content && role === 'assistant') {
    const short = content.length > 80 ? content.slice(0, 80) + '...' : content;
    summary = `<span class="output">output [${content.length}c] ${esc(short)}</span>`;
    detail = content;
  } else if (content) {
    const short = content.length > 80 ? content.slice(0, 80) + '...' : content;
    summary = `<span class="output">${esc(short)}</span>`;
    detail = content;
  } else {
    summary = `<span class="arrow">...</span>`;
  }

  if (ev.action?.Interrupted) {
    summary += ` <span class="err">[INTERRUPTED]</span>`;
  }

  let html = `<span class="summary" onclick="document.getElementById('${uid}').classList.toggle('open')"><span class="idx">${idx}</span> <span class="agent">[${agent}]</span> ${summary}</span>`;
  if (detail) {
    html += `<div class="detail" id="${uid}">${esc(detail)}</div>`;
  }
  return html;
}

async function send() {
  if (sending) return;
  const text = $input.value.trim();
  if (!text) return;

  $input.value = '';
  $input.style.height = 'auto';
  addMsg('user', text);

  sending = true;
  $send.disabled = true;

  const evContainer = createEventStream();
  let eventCount = 0;
  let finalOutput = '';
  let pendingInterrupts = null;
  let pendingEvContainer = null;

  try {
    const body = { message: text, stream: true };
    if (runId) body.run_id = runId;

    const res = await fetch(API + '/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      addMsg('error', `Error ${res.status}: ${err}`);
      evContainer.remove();
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const json = line.slice(6).trim();
        if (!json) continue;

        let envelope;
        try { envelope = JSON.parse(json); } catch { continue; }

        if (envelope.type === 'event' && envelope.event) {
          eventCount++;
          const ev = envelope.event;

          const prev = evContainer.querySelector('.ev.active');
          if (prev) prev.classList.remove('active');

          const evDiv = document.createElement('div');
          evDiv.className = 'ev active';
          evDiv.innerHTML = formatEventLine(ev, eventCount);
          evContainer.appendChild(evDiv);

          const countEl = evContainer.querySelector('[data-count]');
          if (countEl) countEl.textContent = eventCount + ' events';

          evContainer.scrollTop = evContainer.scrollHeight;
          $msg.scrollTop = $msg.scrollHeight;
        }

        if (envelope.type === 'error' && envelope.error) {
          // Remove loading indicator
          const dot2 = evContainer.querySelector('.loading-dot');
          if (dot2) dot2.remove();
          addMsg('error', envelope.error);
          continue;
        }

        if (envelope.type === 'final' && envelope.result) {
          runId = envelope.result.run_id || runId;
          $runId.textContent = 'run: ' + runId;
          finalOutput = envelope.result.output || '';
          // Check for interrupts requiring approval
          if (envelope.result.interrupts && envelope.result.interrupts.length > 0) {
            pendingInterrupts = envelope.result.interrupts;
            pendingEvContainer = evContainer;
          }
        }
      }
    }

    // Remove loading indicator
    const dot = evContainer.querySelector('.loading-dot');
    if (dot) dot.remove();
    const lastActive = evContainer.querySelector('.ev.active');
    if (lastActive) lastActive.classList.remove('active');

    if (finalOutput) {
      addMsg('assistant', finalOutput);
    }

    // Show approval card if there are pending interrupts
    if (pendingInterrupts && pendingInterrupts.length > 0) {
      showApprovalCard(pendingInterrupts, pendingEvContainer, eventCount);
    }

    $msg.scrollTop = $msg.scrollHeight;
  } catch (e) {
    addMsg('error', 'Network error: ' + e.message);
  } finally {
    sending = false;
    $send.disabled = false;
    $input.focus();
  }
}

function showApprovalCard(interrupts, evContainer, baseEventCount) {
  const rootCauses = interrupts.filter(i => i.IsRootCause);
  if (rootCauses.length === 0) return;

  // Build combined targets map (all root causes)
  const allTargets = {};
  for (const intr of rootCauses) allTargets[intr.ID] = 'ok';

  // Auto-approve if toggle is on
  if ($autoApprove.checked) {
    const names = rootCauses.map(i => typeof i.Info === 'string' ? i.Info.split('\n')[0] : i.ID);
    const note = document.createElement('div');
    note.className = 'msg system';
    note.textContent = `Auto-approved ${rootCauses.length} tool(s): ${names.join(', ')}`;
    $msg.appendChild(note);
    resumeWithTargets(allTargets);
    return;
  }

  // Single card for all interrupts
  const card = document.createElement('div');
  card.className = 'approval-card';
  const infos = rootCauses.map(intr => {
    const info = typeof intr.Info === 'string' ? intr.Info : JSON.stringify(intr.Info, null, 2);
    return esc(info);
  });
  // Store targets on the card element
  card._targets = allTargets;
  card.innerHTML = `
    <div class="label">Approval Required (${rootCauses.length} tool calls)</div>
    ${infos.map(info => `<div class="info">${info}</div>`).join('')}
    <div class="actions">
      <button class="btn-approve" onclick="handleApprovalCard(this, 'approve')">Approve All</button>
      <button class="btn-reject" onclick="handleApprovalCard(this, 'reject')">Reject All</button>
    </div>
  `;
  $msg.appendChild(card);
  $msg.scrollTop = $msg.scrollHeight;
}

async function handleApprovalCard(btn, decision) {
  const card = btn.closest('.approval-card');
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  btn.textContent = decision === 'approve' ? 'Approving...' : 'Rejecting...';

  const targets = {};
  const value = decision === 'approve' ? 'ok' : 'reject';
  for (const [id] of Object.entries(card._targets)) targets[id] = value;
  await resumeWithTargets(targets, card, decision);
}

async function resumeWithTargets(targets, card, decision) {
  const evContainer = createEventStream();
  let eventCount = 0;
  let finalOutput = '';
  let pendingInterrupts = null;

  sending = true;
  $send.disabled = true;

  try {
    const res = await fetch(API + '/v1/workflow/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: runId, targets, stream: true })
    });

    if (!res.ok) {
      const err = await res.text();
      addMsg('error', `Resume error ${res.status}: ${err}`);
      return;
    }

    // Update card to show decision if present
    if (card && card.querySelector) {
      const actionsEl = card.querySelector('.actions');
      if (actionsEl) {
        const color = decision === 'approve' ? '#6c6' : '#f66';
        const text = decision === 'approve' ? 'Approved' : 'Rejected';
        actionsEl.innerHTML = `<span style="color:${color};font-size:12px;">${text}</span>`;
      }
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const json = line.slice(6).trim();
        if (!json) continue;

        let envelope;
        try { envelope = JSON.parse(json); } catch { continue; }

        if (envelope.type === 'event' && envelope.event) {
          eventCount++;
          const ev = envelope.event;
          const prev = evContainer.querySelector('.ev.active');
          if (prev) prev.classList.remove('active');
          const evDiv = document.createElement('div');
          evDiv.className = 'ev active';
          evDiv.innerHTML = formatEventLine(ev, eventCount);
          evContainer.appendChild(evDiv);
          const countEl = evContainer.querySelector('[data-count]');
          if (countEl) countEl.textContent = eventCount + ' events';
          evContainer.scrollTop = evContainer.scrollHeight;
          $msg.scrollTop = $msg.scrollHeight;
        }

        if (envelope.type === 'error' && envelope.error) {
          const dot2 = evContainer.querySelector('.loading-dot');
          if (dot2) dot2.remove();
          addMsg('error', envelope.error);
        }

        if (envelope.type === 'final' && envelope.result) {
          runId = envelope.result.run_id || runId;
          finalOutput = envelope.result.output || '';
          if (envelope.result.interrupts && envelope.result.interrupts.length > 0) {
            pendingInterrupts = envelope.result.interrupts;
          }
        }
      }
    }

    const dot = evContainer.querySelector('.loading-dot');
    if (dot) dot.remove();
    const lastActive = evContainer.querySelector('.ev.active');
    if (lastActive) lastActive.classList.remove('active');

    if (finalOutput) {
      addMsg('assistant', finalOutput);
    }

    if (pendingInterrupts && pendingInterrupts.length > 0) {
      showApprovalCard(pendingInterrupts, evContainer, eventCount);
    }

    $msg.scrollTop = $msg.scrollHeight;
  } catch (e) {
    addMsg('error', 'Resume error: ' + e.message);
  } finally {
    sending = false;
    $send.disabled = false;
    $input.focus();
  }
}

fetch(API + '/healthz').then(r => r.ok ? $status.textContent = 'connected' : $status.textContent = 'error').catch(() => $status.textContent = 'offline');
</script>
</body>
</html>
